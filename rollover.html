<script>
    const STORAGE_PREFIX = 'dailyChecklist_';
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

    // Storage helper functions using localStorage
    function getData(key) {
        try {
            const value = localStorage.getItem(STORAGE_PREFIX + key);
            return value ? JSON.parse(value) : null;
        } catch (e) {
            console.error('Storage get error:', e);
            return null;
        }
    }

    function setData(key, value) {
        try {
            localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
        } catch (e) {
            console.error('Storage set error:', e);
        }
    }

    function deleteData(key) {
        try {
            localStorage.removeItem(STORAGE_PREFIX + key);
        } catch (e) {
            console.error('Delete error:', e);
        }
    }

    // Initialize data structures
    let staticTasks = [];
    let dayTasks = {
        Monday: [], Tuesday: [], Wednesday: [], Thursday: [], 
        Friday: [], Saturday: [], Sunday: []
    };
    let monthlyTasks = [];
    let todaysTasks = [];
    let todayDate = new Date().toDateString();

    // Load all data
    function loadData() {
        staticTasks = getData('staticTasks') || [];
        dayTasks = getData('dayTasks') || {
            Monday: [], Tuesday: [], Wednesday: [], Thursday: [], 
            Friday: [], Saturday: [], Sunday: []
        };
        monthlyTasks = getData('monthlyTasks') || [];
        
        const storedDate = getData('todayDate');
        const storedTasks = getData('todaysTasks');
        
        if (storedDate !== todayDate) {
            generateTodaysTasks();
        } else if (storedTasks) {
            todaysTasks = storedTasks;
        } else {
            generateTodaysTasks();
        }
    }

    // Generate today's tasks
    function generateTodaysTasks() {
        const today = new Date();
        const dayName = days[today.getDay()];
        const dayNum = today.getDay();
        const dateNum = today.getDate();
        const isWeekend = dayNum === 0 || dayNum === 6;

        todaysTasks = [];

        // Add static tasks
        staticTasks.forEach(taskObj => {
            const task = typeof taskObj === 'string' ? taskObj : taskObj.text;
            const weekdayOnly = typeof taskObj === 'object' ? taskObj.weekdayOnly : false;
            
            if (weekdayOnly && isWeekend) {
                return;
            }
            
            todaysTasks.push({
                id: Date.now() + Math.random(),
                text: task,
                completed: false,
                type: 'static'
            });
        });

        // Add day-specific tasks
        if (dayTasks[dayName]) {
            dayTasks[dayName].forEach(task => {
                todaysTasks.push({
                    id: Date.now() + Math.random(),
                    text: task,
                    completed: false,
                    type: 'day'
                });
            });
        }

        // Add monthly tasks with automatic weekend→Friday logic
        monthlyTasks.forEach(mt => {
            const taskDate = typeof mt === 'object' ? mt.date : mt;
            const taskText = typeof mt === 'object' ? mt.task : mt;
            
            let shouldShow = false;
            
            const scheduledDate = new Date(today.getFullYear(), today.getMonth(), taskDate);
            const scheduledDay = scheduledDate.getDay();
            
            if (scheduledDay === 0 || scheduledDay === 6) {
                let daysToSubtract = scheduledDay === 0 ? 2 : 1;
                const fridayDate = new Date(scheduledDate);
                fridayDate.setDate(scheduledDate.getDate() - daysToSubtract);
                
                if (today.toDateString() === fridayDate.toDateString()) {
                    shouldShow = true;
                }
            } else {
                shouldShow = dateNum === taskDate;
            }
            
            if (shouldShow) {
                todaysTasks.push({
                    id: Date.now() + Math.random(),
                    text: typeof taskText === 'object' ? taskText.task : taskText,
                    completed: false,
                    type: 'monthly'
                });
            }
        });

        // Carry over uncompleted tasks
        const previousTasks = getData('todaysTasks');
        if (previousTasks) {
            previousTasks.forEach(task => {
                if ((task.type === 'adhoc' || task.type === 'monthly') && !task.completed) {
                    todaysTasks.push({
                        ...task,
                        id: Date.now() + Math.random()
                    });
                }
            });
        }

        setData('todayDate', todayDate);
        setData('todaysTasks', todaysTasks);
    }

    function updateDateDisplay() {
        const today = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('dateDisplay').textContent = today.toLocaleDateString('en-US', options);
    }

    function renderTodayChecklist() {
        const container = document.getElementById('todayChecklist');
        
        let html = '';

        const staticTasksHtml = todaysTasks.filter(t => t.type === 'static');
        const dayTasksHtml = todaysTasks.filter(t => t.type === 'day');
        const monthlyTasksHtml = todaysTasks.filter(t => t.type === 'monthly');
        const adhocTasksHtml = todaysTasks.filter(t => t.type === 'adhoc');

        if (todaysTasks.length === 0) {
            html += '<div class="empty-state">No recurring tasks for today! Add some below or set them up in the Setup tab.</div>';
        }

        if (staticTasksHtml.length > 0) {
            html += '<div class="checklist-section">';
            html += '<div class="section-title">⭐ Daily Tasks</div>';
            html += '<div class="section-subtitle">Complete every day</div>';
            staticTasksHtml.forEach(task => {
                html += renderTaskItem(task);
            });
            html += '</div>';
        }

        if (dayTasksHtml.length > 0) {
            html += '<div class="checklist-section">';
            html += `<div class="section-title">📅 ${days[new Date().getDay()]} Tasks</div>`;
            dayTasksHtml.forEach(task => {
                html += renderTaskItem(task);
            });
            html += '</div>';
        }

        if (monthlyTasksHtml.length > 0) {
            html += '<div class="checklist-section">';
            html += '<div class="section-title">📆 Monthly Tasks</div>';
            html += `<div class="section-subtitle">Scheduled for the ${new Date().getDate()}th</div>`;
            monthlyTasksHtml.forEach(task => {
                html += renderTaskItem(task);
            });
            html += '</div>';
        }

        if (adhocTasksHtml.length > 0) {
            html += '<div class="checklist-section">';
            html += '<div class="section-title">📝 Additional To-Dos</div>';
            adhocTasksHtml.forEach(task => {
                html += renderTaskItem(task);
            });
            html += '</div>';
        }

        html += '<div class="checklist-section add-task-section">';
        html += '<div class="section-title">➕ Add New Task</div>';
        html += '<div class="add-task-input">';
        html += '<input type="text" id="newAdhocTask" placeholder="What else needs to be done today?">';
        html += '<button class="btn btn-primary" onclick="addAdhocTask()">Add</button>';
        html += '</div>';
        html += '</div>';

        html += '<div class="blank-lines">';
        html += '<h4>Additional Notes:</h4>';
        html += '<div class="blank-lines-grid">';
        for (let i = 0; i < 10; i++) {
            html += '<div class="blank-line"></div>';
        }
        html += '</div>';
        html += '</div>';

        container.innerHTML = html;
    }

    function renderTaskItem(task) {
        return `
            <div class="task-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                <div class="checkbox-wrapper">
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                </div>
                <div class="task-content">
                    <div class="task-text">${task.text}</div>
                </div>
            </div>
        `;
    }

    function renderSetup() {
        let html = '';
        staticTasks.forEach((taskObj, index) => {
            const task = typeof taskObj === 'string' ? taskObj : taskObj.text;
            const weekdayOnly = typeof taskObj === 'object' ? taskObj.weekdayOnly : false;
            
            html += `
                <div class="task-item">
                    <input type="text" value="${task}" onchange="updateStaticTask(${index}, this.value)">
                    <label class="checkbox-label">
                        <input type="checkbox" ${weekdayOnly ? 'checked' : ''} onchange="toggleStaticWeekday(${index}, this.checked)">
                        Weekdays
                    </label>
                    <button class="btn btn-danger" onclick="deleteStaticTask(${index})">✕</button>
                </div>
            `;
        });
        document.getElementById('staticTasksList').innerHTML = html;

        html = '';
        Object.keys(dayTasks).forEach(day => {
            html += `<div class="day-tasks">`;
            html += `<h4>${day}</h4>`;
            dayTasks[day].forEach((task, index) => {
                html += `
                    <div class="task-item">
                        <input type="text" value="${task}" onchange="updateDayTask('${day}', ${index}, this.value)">
                        <button class="btn btn-danger" onclick="deleteDayTask('${day}', ${index})">✕</button>
                    </div>
                `;
            });
            html += `
                <div class="add-task-input" style="margin-top: 8px;">
                    <input type="text" id="new${day}Task" placeholder="Add ${day} task...">
                    <button class="btn btn-primary" onclick="addDayTask('${day}')">Add</button>
                </div>
            `;
            html += `</div>`;
        });
        document.getElementById('dayTasksList').innerHTML = html;

        html = '';
        monthlyTasks.sort((a, b) => {
            const dateA = typeof a === 'object' ? a.date : a;
            const dateB = typeof b === 'object' ? b.date : b;
            return dateA - dateB;
        }).forEach((mt, index) => {
            const date = typeof mt === 'object' ? mt.date : mt;
            const task = typeof mt === 'object' ? mt.task : '';
            
            html += `
                <div class="monthly-task-item">
                    <input type="number" value="${date}" min="1" max="31" onchange="updateMonthlyTaskDate(${index}, this.value)">
                    <input type="text" value="${task}" onchange="updateMonthlyTaskText(${index}, this.value)">
                    <button class="btn btn-danger" onclick="deleteMonthlyTask(${index})">✕</button>
                </div>
            `;
        });
        document.getElementById('monthlyTasksList').innerHTML = html;
    }

    function toggleTask(id) {
        const task = todaysTasks.find(t => t.id === id);
        if (task) {
            task.completed = !task.completed;
            setData('todaysTasks', todaysTasks);
            renderTodayChecklist();
        }
    }

    function addAdhocTask() {
        const input = document.getElementById('newAdhocTask');
        const text = input.value.trim();
        if (text) {
            todaysTasks.push({
                id: Date.now() + Math.random(),
                text: text,
                completed: false,
                type: 'adhoc'
            });
            setData('todaysTasks', todaysTasks);
            input.value = '';
            renderTodayChecklist();
        }
    }

    function addStaticTask() {
        const input = document.getElementById('newStaticTask');
        const weekdayCheckbox = document.getElementById('newStaticWeekdayOnly');
        const text = input.value.trim();
        if (text) {
            staticTasks.push({
                text: text,
                weekdayOnly: weekdayCheckbox.checked
            });
            setData('staticTasks', staticTasks);
            input.value = '';
            weekdayCheckbox.checked = false;
            renderSetup();
        }
    }

    function updateStaticTask(index, value) {
        if (typeof staticTasks[index] === 'string') {
            staticTasks[index] = { text: value, weekdayOnly: false };
        } else {
            staticTasks[index].text = value;
        }
        setData('staticTasks', staticTasks);
    }

    function toggleStaticWeekday(index, checked) {
        if (typeof staticTasks[index] === 'string') {
            staticTasks[index] = { text: staticTasks[index], weekdayOnly: checked };
        } else {
            staticTasks[index].weekdayOnly = checked;
        }
        setData('staticTasks', staticTasks);
    }

    function deleteStaticTask(index) {
        staticTasks.splice(index, 1);
        setData('staticTasks', staticTasks);
        renderSetup();
    }

    function addDayTask(day) {
        const input = document.getElementById(`new${day}Task`);
        const text = input.value.trim();
        if (text) {
            dayTasks[day].push(text);
            setData('dayTasks', dayTasks);
            input.value = '';
            renderSetup();
        }
    }

    function updateDayTask(day, index, value) {
        dayTasks[day][index] = value;
        setData('dayTasks', dayTasks);
    }

    function deleteDayTask(day, index) {
        dayTasks[day].splice(index, 1);
        setData('dayTasks', dayTasks);
        renderSetup();
    }

    function addMonthlyTask() {
        const dateInput = document.getElementById('newMonthlyDate');
        const taskInput = document.getElementById('newMonthlyTask');
        const date = parseInt(dateInput.value);
        const task = taskInput.value.trim();
        
        if (date >= 1 && date <= 31 && task) {
            monthlyTasks.push({ 
                date: date, 
                task: task
            });
            setData('monthlyTasks', monthlyTasks);
            dateInput.value = '';
            taskInput.value = '';
            renderSetup();
        }
    }

    function updateMonthlyTaskDate(index, value) {
        if (typeof monthlyTasks[index] !== 'object') {
            monthlyTasks[index] = { date: parseInt(value), task: '' };
        } else {
            monthlyTasks[index].date = parseInt(value);
        }
        setData('monthlyTasks', monthlyTasks);
        renderSetup();
    }

    function updateMonthlyTaskText(index, value) {
        if (typeof monthlyTasks[index] !== 'object') {
            monthlyTasks[index] = { date: 1, task: value };
        } else {
            monthlyTasks[index].task = value;
        }
        setData('monthlyTasks', monthlyTasks);
    }

    function deleteMonthlyTask(index) {
        monthlyTasks.splice(index, 1);
        setData('monthlyTasks', monthlyTasks);
        renderSetup();
    }

    function refreshChecklist() {
        generateTodaysTasks();
        switchTab('today');
        alert('✓ Checklist refreshed with your updated tasks!');
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        
        const printBtn = document.querySelector('.print-btn');
        
        if (tab === 'today') {
            document.querySelector('.tab:nth-child(1)').classList.add('active');
            document.getElementById('todayTab').classList.add('active');
            printBtn.classList.remove('hidden');
            renderTodayChecklist();
        } else {
            document.querySelector('.tab:nth-child(2)').classList.add('active');
            document.getElementById('setupTab').classList.add('active');
            printBtn.classList.add('hidden');
            renderSetup();
        }
    }

    function init() {
        updateDateDisplay();
        loadData();
        renderTodayChecklist();
        renderSetup();
        
        window.addEventListener('focus', () => {
            const currentDate = new Date().toDateString();
            if (currentDate !== todayDate) {
                todayDate = currentDate;
                generateTodaysTasks();
                updateDateDisplay();
                renderTodayChecklist();
            }
        });
    }

    init();
</script>
